<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sơ đồ tư duy - Android</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f7f6f"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sơ đồ tư duy"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><style>

.sep{width:1px;height:26px;background:var(--bd)}

html,body{overscroll-behavior:none}*{-webkit-tap-highlight-color:transparent}
#dock{background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 16px #0002;border-top:1px solid var(--bd)}
@media(max-width:700px){#dock{max-height:62dvh;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-bottom:env(safe-area-inset-bottom,0px)}#tabs{position:sticky;top:0;z-index:5;background:var(--card)}}

.pane button:active,.pane label.b:active{transform:scale(.97)}
.pane .wide{grid-column:1/-1}

.pane .sw{width:40px;height:40px;min-height:0;padding:0;border-radius:50%}

.pane .sw{flex:none}#tabs button{font-size:13px}.mic.live,.live{background:#d1495b!important;color:#fff!important;border-color:#d1495b!important}
.cb{position:absolute;right:-8px;top:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:11px;line-height:20px;text-align:center;padding:0 4px}
.quiz .node:not(.rev)>div:last-child{filter:blur(8px)}.quiz .node:not(.rev) img{filter:blur(10px)}
#hint.t{opacity:1;font-weight:600;background:var(--card);padding:5px 9px;border-radius:8px;box-shadow:0 1px 6px #0003;max-width:calc(100% - 28px)}

/option><option value="❓">❓</option><option value="📌">📌</option><option value="❤️">❤️</option><option value="⚠️">⚠️</option><option value="x">Bỏ biểu tượng</option></select><select id="th" class="wide"><option value="">Đổi bảng màu…</option><option>Rừng xanh</option><option>Biển</option><option>Hoàng hôn</option><option>Giấy mực</option></select><select id="tp" class="wide"><option value="">Tạo từ mẫu…</option><option>Sơ đồ trống</option><option>Kế hoạch dự án</option><option>Ôn thi</option><option>SWOT</option></select><button id="exj">Lưu file .json</button><label class="b">Mở file .json<input type="file" id="fjs" accept=".json,application/json" hidden></label><button id="exp" class="wide">Xuất ảnh PNG</button></div></div></div><script>
const $=s=>document.querySelector(s),vp=$('#vp'),world=$('#world'),nd=$('#nd'),ed=$('#ed'),txt=$('#txt'),fr=$('#fr');
const COL=['#2f7f6f','#d1495b','#edae49','#3d5a80','#7b4fa3','#e07a3f'],KEY='somo-tu-duy-android';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.nodes||!S.nodes.length)S={nodes:[
{id:1,p:null,x:0,y:0,t:'Chủ đề chính',c:COL[0],f:'pill'},
{id:2,p:1,x:0,y:0,t:'Ý chính 1',c:COL[1],f:'pill'},
{id:3,p:1,x:0,y:0,t:'Ý chính 2',c:COL[2],f:'pill'},
{id:4,p:1,x:0,y:0,t:'Ý chính 3',c:COL[3],f:'pill'}],bg:null,op:.5,v:null,seeded:1};
let nid=Math.max(...S.nodes.map(n=>n.id)),sel=S.nodes[0].id,drag=null;
const byId=id=>S.nodes.find(n=>n.id===id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){$('#hint').textContent='Bộ nhớ trình duyệt đầy: ảnh quá nặng sẽ không được lưu lại.'}}
function apply(){world.style.transform=`translate(${S.v.x}px,${S.v.y}px) scale(${S.v.k})`}
function bgApply(){$('#bgi').style.backgroundImage=S.bg?`url(${S.bg})`:'none';$('#bgi').style.opacity=S.op;$('#op').value=S.op}
function edges(){ed.innerHTML=S.nodes.map(n=>{const p=byId(n.p);if(!p)return'';const m=(p.x+n.x)/2;return`<path d="M${p.x} ${p.y}C${m} ${p.y} ${m} ${n.y} ${n.x} ${n.y}" fill="none" stroke="${n.c}" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>`}).join('')}
function render(){nd.innerHTML='';S.nodes.forEach(n=>{
const e=document.createElement('div');e.className='node f-'+n.f+(n.id===sel?' sel':'');e.dataset.id=n.id;
e.style.left=n.x+'px';e.style.top=n.y+'px';e.style.setProperty('--c',n.c);
if(n.i){if(n.f==='cover')e.style.backgroundImage=`url(${n.i})`;else{const im=new Image();im.src=n.i;im.draggable=false;e.appendChild(im)}}
const s=document.createElement('div');s.textContent=n.t;e.appendChild(s);nd.appendChild(e)});edges()}
function pick(id){sel=id;nd.querySelectorAll('.node').forEach(x=>x.classList.toggle('sel',+x.dataset.id===id));const n=byId(id);txt.value=n.t;fr.value=n.f}
function layout(){const kids=id=>S.nodes.filter(n=>n.p===id);let row=0;
(function go(n,d){const ks=kids(n.id);n.x=d*250;if(!ks.length)n.y=row++*135;else{ks.forEach(k=>go(k,d+1));n.y=(ks[0].y+ks[ks.length-1].y)/2}})(S.nodes.find(n=>n.p==null),0);
const r=S.nodes.find(n=>n.p==null),dy=r.y;S.nodes.forEach(n=>n.y-=dy)}
function center(){const w=vp.clientWidth,h=vp.clientHeight,r=S.nodes.find(n=>n.p==null)||S.nodes[0];S.v={x:w*.25-r.x*1,y:h/2-r.y,k:Math.min(1,w/900+.35)};apply()}
function zoomAt(cx,cy,f){const r=vp.getBoundingClientRect(),x=cx-r.left,y=cy-r.top,k=Math.max(.2,Math.min(3,S.v.k*f));f=k/S.v.k;S.v.x=x-(x-S.v.x)*f;S.v.y=y-(y-S.v.y)*f;S.v.k=k}
/* kéo nút */
nd.addEventListener('pointerdown',e=>{const el=e.target.closest('.node');if(!el)return;e.stopPropagation();const n=byId(+el.dataset.id);pick(n.id);drag={n,el,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y}});
addEventListener('pointermove',e=>{if(!drag)return;const{n,el}=drag;n.x=drag.ox+(e.clientX-drag.sx)/S.v.k;n.y=drag.oy+(e.clientY-drag.sy)/S.v.k;el.style.left=n.x+'px';el.style.top=n.y+'px';edges()});
addEventListener('pointerup',()=>{if(drag){drag=null;save()}});
/* kéo nền + chụm thu phóng */
const P=new Map();
vp.addEventListener('pointerdown',e=>{P.set(e.pointerId,[e.clientX,e.clientY]);try{vp.setPointerCapture(e.pointerId)}catch(_){}});
vp.addEventListener('pointermove',e=>{const o=P.get(e.pointerId);if(!o||drag)return;
if(P.size===1){S.v.x+=e.clientX-o[0];S.v.y+=e.clientY-o[1]}
else if(P.size===2){const ids=[...P.keys()],a=P.get(ids[0]),b=P.get(ids[1]),d0=Math.hypot(a[0]-b[0],a[1]-b[1]);P.set(e.pointerId,[e.clientX,e.clientY]);const a2=P.get(ids[0]),b2=P.get(ids[1]),d1=Math.hypot(a2[0]-b2[0],a2[1]-b2[1]);if(d0>0)zoomAt((a2[0]+b2[0])/2,(a2[1]+b2[1])/2,d1/d0)}
P.set(e.pointerId,[e.clientX,e.clientY]);apply()});
const up=e=>{if(P.delete(e.pointerId)&&!P.size)save()};vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);

/* thao tác */
function add(parent){const p=byId(parent),c=S.nodes.filter(n=>n.p===parent).length;
const n={id:++nid,p:parent,x:p.x+250,y:p.y+c*95-40,t:'Ý mới',c:COL[(S.nodes.length)%COL.length],f:'pill'};S.nodes.push(n);sel=n.id;render();pick(n.id);save();txt.focus();txt.select()}
$('#addc').onclick=()=>add(sel);
$('#adds').onclick=()=>{const n=byId(sel);add(n.p==null?n.id:n.p)};
$('#del').onclick=()=>{const n=byId(sel);if(n.p==null)return;const rm=new Set([n.id]);let g=1;while(g){g=0;S.nodes.forEach(x=>{if(rm.has(x.p)&&!rm.has(x.id)){rm.add(x.id);g=1}})}
S.nodes=S.nodes.filter(x=>!rm.has(x.id));sel=n.p;render();pick(sel);save()};
$('#lay').onclick=()=>{layout();center();render();pick(sel);save()};
$('#ctr').onclick=()=>{center();save()};
txt.oninput=()=>{byId(sel).t=txt.value;render();save()};
fr.onchange=()=>{byId(sel).f=fr.value;render();save()};
$('#sws').innerHTML=COL.map(c=>`<button class="sw" style="background:${c}" data-c="${c}" aria-label="Màu ${c}"></button>`).join('');
$('#sws').onclick=e=>{const c=e.target.dataset.c;if(c){byId(sel).c=c;render();save()}};
function readImg(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82))};im.src=r.result};r.readAsDataURL(f)}
$('#fin').onchange=e=>{const f=e.target.files[0];if(!f)return;readImg(f,500,u=>{const n=byId(sel);n.i=u;if(n.f==='pill'||n.f==='box'||n.f==='text')n.f='frame';render();pick(sel);save()});e.target.value=''};
$('#rmi').onclick=()=>{const n=byId(sel);delete n.i;if(n.f==='cover')n.f='pill';render();pick(sel);save()};
$('#fbg').onchange=e=>{const f=e.target.files[0];if(!f)return;readImg(f,1600,u=>{S.bg=u;bgApply();save()});e.target.value=''};
$('#rmb').onclick=()=>{S.bg=null;bgApply();save()};
$('#op').oninput=e=>{S.op=+e.target.value;bgApply()};$('#op').onchange=save;
addEventListener('keydown',e=>{if(e.target===txt||e.target.tagName==='SELECT')return;
if(e.key==='Tab'){e.preventDefault();$('#addc').click()}else if(e.key==='Enter'){e.preventDefault();$('#adds').click()}else if(e.key==='Delete'||e.key==='Backspace'){$('#del').click()}});
if(!S.v){if(S.seeded){layout();delete S.seeded}center()}else apply();
bgApply();render();pick(sel);

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{const p=$('#'+b.dataset.p),open=!p.hidden;
document.querySelectorAll('.pane').forEach(x=>x.hidden=true);document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
if(!open){p.hidden=false;b.classList.add('on')}});

let hist=[JSON.stringify(S.nodes)],fut=[],lt=0;const _save=save;
save=function(){const j=JSON.stringify(S.nodes),t=Date.now();if(j!==hist[hist.length-1]){fut=[];if(t-lt<600&&hist.length>1)hist[hist.length-1]=j;else{hist.push(j);if(hist.length>40)hist.shift()}lt=t}_save()};

function undo(){if(hist.length<2)return;fut.push(hist.pop());gotoH(hist[hist.length-1])}

$('#undo').onclick=undo;
/* ===== Tính năng nâng cao ===== */
const HINT=$('#hint').textContent,TH={"Rừng xanh": ["#2f7f6f", "#5aa469", "#8fb339", "#3d6b5e", "#c0a050"], "Biển": ["#1f5f8b", "#2a9d8f", "#4ea8de", "#264653", "#7b9acc"], "Hoàng hôn": ["#c9184a", "#ff7b00", "#ffb703", "#7b2d8e", "#e56b6f"], "Giấy mực": ["#222222", "#555555", "#888888", "#3a3a3a", "#999999"]},TPL={"Sơ đồ trống": ["Chủ đề chính"], "Kế hoạch dự án": ["Dự án", ["Mục tiêu", ["Đo lường"], ["Thời hạn"]], ["Công việc", ["Việc cần làm"], ["Phân công"]], ["Rủi ro"], ["Nguồn lực"]], "Ôn thi": ["Môn học", ["Chương 1", ["Khái niệm"], ["Ví dụ"]], ["Chương 2"], ["Công thức"], ["Câu hay sai"]], "SWOT": ["SWOT", ["Điểm mạnh"], ["Điểm yếu"], ["Cơ hội"], ["Thách thức"]]};
function toast(m){const h=$('#hint');h.textContent=m;h.classList.add('t');clearTimeout(toast.i);toast.i=setTimeout(()=>{h.textContent=HINT;h.classList.remove('t')},4000)}
const vis=n=>{let p=byId(n.p);while(p){if(p.col)return false;p=byId(p.p)}return true};
edges=function(){ed.innerHTML=S.nodes.filter(vis).map(n=>{const p=byId(n.p);if(!p)return'';const m=(p.x+n.x)/2;return`<path d="M${p.x} ${p.y}C${m} ${p.y} ${m} ${n.y} ${n.x} ${n.y}" fill="none" stroke="${n.c}" stroke-width="3.5" stroke-linecap="round" opacity=".85"/>`}).join('')};
const _r=render;render=function(){_r();nd.querySelectorAll('.node').forEach(e=>{const n=byId(+e.dataset.id);if(!vis(n)){e.remove();return}
if(n.col){const k=S.nodes.filter(x=>x.p===n.id).length;if(k){const b=document.createElement('span');b.className='cb';b.textContent='+'+k;e.prepend(b)}}})};
const setc=(n,c)=>{n.c=c;S.nodes.filter(k=>k.p===n.id).forEach(k=>setc(k,c))};
function mk(p,t){const P=byId(p),c=S.nodes.filter(n=>n.p===p).length,n={id:++nid,p,x:P.x+250,y:P.y+c*95,t:t||'Ý mới',c:COL[S.nodes.length%COL.length],f:'pill'};S.nodes.push(n);render();pick(sel);save();return n}
/* giọng nói */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function voice(mode,btn){
if(rec){rec.stop();return}
if(!SR){toast('Trình duyệt này chưa hỗ trợ nhập giọng nói. Hãy mở bằng Chrome hoặc Edge.');return}
const par=sel;let done=0;rec=new SR();rec.lang='vi-VN';rec.interimResults=true;rec.continuous=mode==='kids';btn.classList.add('live');
toast(mode==='kids'?'Đang nghe: mỗi câu là một nhánh mới. Bấm lại để dừng.':'Đang nghe, hãy nói…');
rec.onresult=e=>{if(mode==='one'){const t=[...e.results].map(r=>r[0].transcript).join('');const n=byId(par);n.t=t;txt.value=t;render();pick(par);if(e.results[e.results.length-1].isFinal)save()}
else for(;done<e.results.length;done++){const r=e.results[done];if(!r.isFinal)break;mk(par,r[0].transcript.trim())}};
rec.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Chưa có quyền dùng micro. Hãy cho phép micro cho trang này.':e.error==='no-speech'?'Không nghe thấy giọng nói.':'Lỗi giọng nói: '+e.error);
rec.onend=()=>{rec=null;document.querySelectorAll('.mic').forEach(b=>b.classList.remove('live'))};
try{rec.start()}catch(_){rec=null;btn.classList.remove('live')}}
$('#mic1').onclick=()=>voice('one',$('#mic1'));$('#mic2').onclick=()=>voice('kids',$('#mic2'));
/* thu gọn, ôn tập, biểu tượng, màu, mẫu */
$('#col').onclick=()=>{const n=byId(sel);if(S.nodes.some(k=>k.p===n.id)){n.col=!n.col;render();pick(sel);save()}else toast('Nút này chưa có nhánh con.')};
let quiz=false;$('#quiz').onclick=()=>{quiz=!quiz;nd.classList.toggle('quiz',quiz);nd.querySelectorAll('.rev').forEach(e=>e.classList.remove('rev'));$('#quiz').classList.toggle('live',quiz);toast(quiz?'Ôn tập: chạm vào nút để hiện nội dung':'Đã thoát chế độ ôn tập')};
nd.addEventListener('click',e=>{const el=e.target.closest('.node');if(quiz&&el)el.classList.toggle('rev')});
$('#em').onchange=e=>{const v=e.target.value;if(v){const n=byId(sel);n.t=(v==='x'?'':v+' ')+n.t.replace(/^\p{Extended_Pictographic}\uFE0F?\s*/u,'');txt.value=n.t;render();pick(sel);save()}e.target.selectedIndex=0};
$('#th').onchange=e=>{const p=TH[e.target.value];if(p){const r=S.nodes.find(n=>n.p==null);r.c=p[0];S.nodes.filter(n=>n.p===r.id).forEach((t,i)=>setc(t,p[(i+1)%p.length]));render();pick(sel);save()}e.target.selectedIndex=0};
function build(a,p){const n={id:++nid,p,x:0,y:0,t:a[0],c:COL[0],f:'pill'};S.nodes.push(n);a.slice(1).forEach(k=>build(k,n.id));return n}
$('#tp').onchange=e=>{const a=TPL[e.target.value];if(a){S.nodes=[];const r=build(a,null);S.nodes.filter(n=>n.p===r.id).forEach((t,i)=>setc(t,COL[(i+1)%COL.length]));sel=r.id;layout();center();render();pick(sel);save();toast('Đã tạo sơ đồ từ mẫu. Có thể hoàn tác.')}e.target.selectedIndex=0};
$('#redo').onclick=redo;
addEventListener('keydown',e=>{const t=e.target;if(t===txt||t.isContentEditable||t.tagName==='SELECT')return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
/* lưu, mở, xuất ảnh */
async function saveFile(name,data){const d=window.claude?await window.claude.use('downloads'):null;if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Đã tải '+name);return}
try{await d.save({filename:name,data});toast('Đã lưu '+name)}catch(e){if(e&&e.code!=='declined')toast('Không lưu được file ('+((e&&e.code)||'lỗi')+')')}}
$('#exj').onclick=()=>saveFile('so-do-tu-duy.json',new Blob([JSON.stringify({nodes:S.nodes,bg:S.bg,op:S.op})],{type:'application/json'}));
$('#fjs').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());
if(!Array.isArray(d.nodes)||!d.nodes.length||!d.nodes.every(n=>n&&typeof n.id==='number'&&typeof n.t==='string'))throw 0;
S.nodes=d.nodes;S.bg=d.bg||null;S.op=d.op||.5;nid=Math.max(...S.nodes.map(n=>n.id));sel=(S.nodes.find(n=>n.p==null)||S.nodes[0]).id;center();bgApply();render();pick(sel);save();toast('Đã mở sơ đồ.')}catch(_){toast('File không đúng định dạng sơ đồ.')}};
const load=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});
function cov(g,i,x,y,w,h){const k=Math.max(w/i.width,h/i.height),sw=w/k,sh=h/k;g.drawImage(i,(i.width-sw)/2,(i.height-sh)/2,sw,sh,x,y,w,h)}
function wrapT(g,t,mw){const L=[];let l='';t.split(/\s+/).forEach(w=>{const q=l?l+' '+w:w;if(g.measureText(q).width>mw&&l){L.push(l);l=w}else l=q});L.push(l);return L}
$('#exp').onclick=async()=>{const its=[...nd.querySelectorAll('.node')].map(e=>({n:byId(+e.dataset.id),w:e.offsetWidth,h:e.offsetHeight}));if(!its.length)return;toast('Đang tạo ảnh…');
const M=60;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;its.forEach(({n,w,h})=>{x0=Math.min(x0,n.x-w/2);x1=Math.max(x1,n.x+w/2);y0=Math.min(y0,n.y-h/2);y1=Math.max(y1,n.y+h/2)});
const W=x1-x0+2*M,H=y1-y0+2*M,sc=Math.min(2,3000/Math.max(W,H)),c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;const g=c.getContext('2d');g.scale(sc,sc);g.translate(M-x0,M-y0);
g.fillStyle=getComputedStyle(document.body).backgroundColor;g.fillRect(x0-M,y0-M,W,H);
if(S.bg){const i=await load(S.bg);if(i){g.globalAlpha=S.op;cov(g,i,x0-M,y0-M,W,H);g.globalAlpha=1}}
g.lineWidth=3.5;g.lineCap='round';its.forEach(({n})=>{const p=byId(n.p);if(!p||!vis(n))return;const m=(p.x+n.x)/2;g.strokeStyle=n.c;g.beginPath();g.moveTo(p.x,p.y);g.bezierCurveTo(m,p.y,m,n.y,n.x,n.y);g.stroke()});
g.font='600 14px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
for(const{n,w,h}of its){const lt=n.f==='polaroid'||n.f==='frame',ph=n.f==='text';g.save();g.translate(n.x-w/2,n.y-h/2);
const r=n.f==='pill'&&!n.i?h/2:n.f==='box'?8:n.f==='polaroid'||n.f==='frame'?3:16;g.beginPath();g.roundRect(0,0,w,h,r);
if(!ph){g.fillStyle=lt?'#fffdf6':n.c;g.fill();if(n.f==='frame'){g.strokeStyle=n.c;g.lineWidth=14;g.stroke()}}
const img=n.i?await load(n.i):null,L=wrapT(g,n.t,w-24),th=L.length*18;let ty=h/2-th/2+9;
if(img&&n.f==='cover'){g.save();g.clip();cov(g,img,0,0,w,h);g.restore();g.fillStyle='#0004';g.fillRect(0,h-th-16,w,th+16);ty=h-th-8+9}
else if(img){const iw=Math.min(w-18,n.f==='circle'||n.f==='polaroid'?136:144),ih=n.f==='circle'||n.f==='polaroid'?iw:iw*.75;g.save();g.beginPath();if(n.f==='circle')g.arc(w/2,10+ih/2,iw/2,0,7);else g.rect((w-iw)/2,10,iw,ih);g.clip();cov(g,img,(w-iw)/2,10,iw,ih);g.restore();ty=10+ih+8+9}
g.fillStyle=ph?n.c:lt?'#222':'#fff';L.forEach((s,i)=>g.fillText(s,w/2,ty+i*18));g.restore()}
c.toBlob(b=>saveFile('so-do-tu-duy.png',b),'image/png')};
render();pick(sel);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
