<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Sơ đồ tư duy</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f7f6f"><meta name="color-scheme" content="light dark"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Sơ đồ tư duy"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png"><style>
:root{--bg:#eef0ea;--fg:#1c2320;--card:#fff;--bd:#cfd5cb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a18;--fg:#e8ece9;--card:#222927;--bd:#38413d}}
:root[data-theme="dark"]{--bg:#161a18;--fg:#e8ece9;--card:#222927;--bd:#38413d}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.3 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(var(--bd) 1px,transparent 1px);background-size:24px 24px}
#bgi{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#ed{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#nd{position:absolute;left:0;top:0}
.node{position:absolute;transform:translate(-50%,-50%);max-width:230px;text-align:center;font-weight:600;color:#fff;background:var(--c);padding:9px 16px;box-shadow:0 2px 8px #0003;user-select:none;-webkit-user-select:none;touch-action:none;cursor:pointer;overflow-wrap:anywhere}
.node.sel{outline:3px solid var(--fg);outline-offset:3px}
.node img{display:block;width:130px;height:96px;object-fit:cover;margin:0 auto 6px;border-radius:8px;pointer-events:none}
.f-pill{border-radius:999px}.f-pill:has(img){border-radius:20px}
.f-box{border-radius:8px}
.f-circle{border-radius:28px}.f-circle img{width:112px;height:112px;border-radius:50%}
.f-polaroid{background:#fff;color:#222;border-radius:3px;padding:8px 8px 11px}.f-polaroid img{width:136px;height:136px;border-radius:2px}
.f-frame{background:#fffdf6;color:#222;border:9px solid var(--c);border-radius:2px;padding:6px;box-shadow:0 0 0 2px #0003 inset,0 3px 10px #0004}.f-frame img{border-radius:0;width:144px;height:108px}
.f-cover{min-width:160px;min-height:110px;background-size:cover;background-position:center;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;text-shadow:0 1px 5px #000,0 0 2px #000}
.f-text{background:transparent;color:var(--c);box-shadow:none;font-size:16px;font-weight:700}
#hint{position:absolute;left:10px;top:8px;font-size:12px;opacity:.65;pointer-events:none}
#bar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 10px;background:var(--card);border-top:1px solid var(--bd);-webkit-overflow-scrolling:touch}
#bar>*{flex:none}
#bar button,#bar label.b,#bar select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;cursor:pointer;white-space:nowrap}
#bar button:active,#bar label.b:active{transform:scale(.97)}
#bar button:focus-visible,#bar select:focus-visible,#txt:focus-visible{outline:2px solid #2f7f6f;outline-offset:1px}
#txt{font:inherit;width:150px;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0!important;box-shadow:0 0 0 1px var(--bd)}
.sep{width:1px;height:26px;background:var(--bd)}

html,body{overscroll-behavior:none}*{-webkit-tap-highlight-color:transparent}
#dock{background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -4px 16px #0002;border-top:1px solid var(--bd)}
#tabs{display:flex;padding:4px 8px 0}
#tabs button{flex:1;font:inherit;font-weight:600;color:var(--fg);background:transparent;border:0;border-bottom:3px solid transparent;min-height:48px;opacity:.6}
#tabs button.on{border-bottom-color:#2f7f6f;opacity:1}
.pane{padding:10px 12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.pane[hidden]{display:none}
.pane button,.pane label.b,.pane select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:12px;min-height:48px;padding:0 10px;display:flex;align-items:center;justify-content:center;text-align:center}
.pane button:active,.pane label.b:active{transform:scale(.97)}
.pane .wide{grid-column:1/-1}
#txt{width:100%;box-sizing:border-box;font:16px inherit;min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--fg)}
#sws{display:flex;justify-content:space-between}
.pane .sw{width:40px;height:40px;min-height:0;padding:0;border-radius:50%}
#op{width:100%}
.pane .sw{flex:none}#tabs button{font-size:13px}.mic.live,.live{background:#d1495b!important;color:#fff!important;border-color:#d1495b!important}
.cb{position:absolute;right:-8px;top:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:11px;line-height:20px;text-align:center;padding:0 4px}
.quiz .node:not(.rev)>div:last-child{filter:blur(8px)}.quiz .node:not(.rev) img{filter:blur(10px)}
#hint.t{opacity:1;font-weight:600;background:var(--card);padding:5px 9px;border-radius:8px;box-shadow:0 1px 6px #0003;max-width:calc(100% - 28px)}

#nd{font-size:calc(14px*var(--fs,1))}
.node{width:max-content;max-width:16em;overflow-wrap:break-word;word-break:normal;line-height:1.3}
.node.d0{font-size:1.45em;font-weight:700}.node.d1{font-size:1.15em}
.zb{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px;z-index:5}
.zb button{width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:700 18px/1 system-ui,sans-serif;box-shadow:0 2px 8px #0003;touch-action:manipulation}
.zb button:active{transform:scale(.94)}
@media (orientation:landscape) and (max-height:520px){#dock{max-height:46vh;overflow:auto}.pane{grid-template-columns:repeat(4,1fr)!important}.pane .wide{grid-column:span 2!important}#txt.wide{grid-column:1/-1!important}.zb{flex-direction:row;bottom:8px}}

.node img{width:calc(130px*var(--k,1));height:calc(96px*var(--k,1))}
.f-circle img{width:calc(112px*var(--k,1));height:calc(112px*var(--k,1))}
.f-polaroid img{width:calc(136px*var(--k,1));height:calc(136px*var(--k,1))}
.f-frame img{width:calc(144px*var(--k,1));height:calc(108px*var(--k,1))}
.f-cover{min-width:calc(160px*var(--k,1));min-height:calc(110px*var(--k,1))}

[hidden]{display:none!important}
.node.imp::before{content:'⭐';position:absolute;left:-10px;top:-14px;font-size:1.1em}
.node.lk::after{content:'🔒';position:absolute;right:-8px;bottom:-10px;font-size:.9em}
.node.done{opacity:.65}.node.done>div:last-child{text-decoration:line-through}
.node.wr{outline:3px dashed #d1495b;outline-offset:3px}
.node.hit{box-shadow:0 0 0 4px #ffd60a,0 0 14px #ffd60a}
#hint.t{position:fixed;z-index:60;top:calc(env(safe-area-inset-top,0px) + 8px)}
#sq{font:16px inherit;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);box-sizing:border-box;width:100%}
#pn{position:fixed;inset:0;z-index:50;background:#0007;display:none;align-items:flex-end;justify-content:center}
#pn.on{display:flex}
#pbx{background:var(--card);color:var(--fg);width:min(640px,100%);max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
@media(min-width:700px){#pn{align-items:center}#pbx{border-radius:16px}}
#pbx button,#pbx select,#pbx label.pl,#pbx textarea,#pbx input[type=date]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:44px;box-sizing:border-box}
#pbx label.pl{display:inline-flex;align-items:center}
.pr{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tr{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.tt{flex:1 1 140px}.tr.late .tt{color:#d1495b;font-weight:600}
.tr input[type=checkbox]{width:22px;height:22px}
.cd{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}.cd h3{margin:6px 0}
#dock{max-height:58vh;overflow:auto}#tabs button{font-size:12.5px}
.node.ms{outline:3px solid #2f7fd0;outline-offset:3px}
.mt{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font-size:.68em;font-weight:500;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:10px;padding:1px 8px;z-index:1}
.mt.late{color:#d1495b;border-color:#d1495b;font-weight:700}
.th-neon .node{box-shadow:0 0 14px var(--c),inset 0 0 4px #fff6}.th-neon .node.f-text{box-shadow:none}
.th-glass .node:not(.f-text){background:color-mix(in srgb,var(--c) 55%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid #fff7}
.th-hand .node{font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;border-radius:16px 22px 14px 24px}
.th-min .node{background:transparent;color:var(--fg);border:2px solid var(--c);box-shadow:none}
#pbx input:not([type=checkbox]):not([type=file]){font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:44px;box-sizing:border-box}
#pbx textarea{width:100%}#pbx audio{width:100%;margin-top:8px}

.zen #dock,.zen #side,.zen #hint,.zen .zb,.pres #dock,.pres #side,.pres #hint,.pres .zb{display:none!important}
#zx{display:none;position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:60;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);opacity:.55;font-size:16px}
.zen #zx,.pres #zx{display:block}
.pres #world{transition:transform .45s ease}.pres .node{opacity:.15;transition:opacity .3s}.pres .node.pk{opacity:.9}.pres .node.pf{opacity:1;box-shadow:0 0 0 4px #ffd60a}.pres .node.sel{outline:none}
#pcap{display:none;position:fixed;left:0;right:0;bottom:0;z-index:55;background:#000d;color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));text-align:center}
.pres #pcap{display:block}#pcap button{font:inherit;color:#fff;background:#fff3;border:1px solid #fff5;border-radius:10px;min-height:44px;padding:0 16px}
#lk2{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--fg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#lk2.on{display:flex}#lk2 input{font:24px system-ui;text-align:center;letter-spacing:.3em;width:210px;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
#lk2 button{font:inherit;color:#fff;background:#2f7f6f;border:0;border-radius:12px;min-height:46px;padding:0 28px}

.f-proc{border-radius:6px}.f-term{border-radius:999px;border:3px solid rgba(255,255,255,.55)}
.f-dec{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:26px 40px!important;border-radius:0!important;box-shadow:none}
.stk{position:absolute;right:-12px;top:-18px;font-size:1.7em;line-height:1;z-index:2;pointer-events:none}
.hd{position:absolute;right:-20px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;box-shadow:0 2px 6px #0005;z-index:4;touch-action:none}
.pres .hd,.zen .hd{display:none}
#lk3{position:fixed;inset:0;z-index:110;background:var(--bg);color:var(--fg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}#lk3.on{display:flex}
#lk3 input{font:18px system-ui;width:min(300px,90%);padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);text-align:center}
#lk3 button{font:inherit;color:#fff;background:#2f7f6f;border:0;border-radius:12px;min-height:46px;padding:0 24px}
.bar{height:14px;border-radius:4px;background:#2f7f6f}

/* ===== v11 UI optimization: single-page control center ===== */
:root{
  --accent:#2f7f6f;
  --dock-bg:var(--card);
  --soft:color-mix(in srgb,var(--bg) 82%,var(--card));
}
body{font-size:14px}
#dock{
  position:relative;
  background:var(--dock-bg);
  border-radius:0;
  box-shadow:0 -6px 24px #00018;
  border-top:1px solid var(--bd);
  z-index:10;
}
#dock::before{
  content:"BẢNG ĐIỀU KHIỂN";
  display:block;
  padding:9px 14px 5px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  opacity:.58;
}
#tabs{display:none!important}
/* All controls live on the same page: no tab switching. */
#dock>.pane[hidden]{display:grid!important}
#dock>.pane{
  position:relative;
  padding:10px 12px 14px;
  margin:0 10px 8px;
  background:var(--soft);
  border:1px solid var(--bd);
  border-radius:16px;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px;
}
#dock>.pane::before{
  grid-column:1/-1;
  display:block;
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
  opacity:.55;
  padding:1px 2px 2px;
}
#pa::before{content:"NÚT & NHÁNH"}
#pb::before{content:"ẢNH & KHUNG"}
#pc::before{content:"NỀN"}
#pd::before{content:"CÔNG CỤ"}
#pe::before{content:"TỔ CHỨC & NÂNG CAO"}

#dock button,#dock label.b,#dock select,#dock input,#dock textarea{
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease;
}
#dock button:hover,#dock label.b:hover,#dock select:hover{
  border-color:color-mix(in srgb,var(--accent) 55%,var(--bd));
  box-shadow:0 2px 8px #00012;
}
#dock button:focus-visible,#dock select:focus-visible,#dock input:focus-visible,#dock textarea:focus-visible{
  outline:2px solid var(--accent);outline-offset:1px;
}
#txt{
  font-size:16px!important;
  font-weight:600;
  background:var(--card)!important;
  box-shadow:0 2px 8px #00010;
}
#addc,#adds{font-weight:700;border-color:color-mix(in srgb,var(--accent) 35%,var(--bd))}
#del{color:#b33!important}
#ctr{font-weight:700}
#dock .mic.wide{grid-column:1/-1}
#dock .sw{box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--bd)}
#dock .sep{display:none}
#sws{padding:3px 2px}
#hint{
  left:12px;top:12px;
  background:color-mix(in srgb,var(--card) 86%,transparent);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding:7px 10px;border:1px solid var(--bd);border-radius:10px;
  box-shadow:0 2px 10px #00015;
}
.zb{right:12px;bottom:12px}
.zb button{width:44px;height:44px}
.node{
  box-shadow:0 3px 12px #00022;
  transition:box-shadow .12s ease,transform .08s ease,opacity .12s ease;
}
.node.sel{
  outline:2px solid var(--accent);
  outline-offset:3px;
  box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent),0 5px 16px #0003;
}
#vp{background-size:22px 22px}
@media(min-width:900px){
  #app{flex-direction:row}
  #vp{min-width:0}
  #dock{
    flex:0 0 390px;
    width:390px;
    max-height:none!important;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    border-top:0;
    border-left:1px solid var(--bd);
    box-shadow:-6px 0 24px #00018;
  }
  #dock::before{position:sticky;top:0;background:var(--dock-bg);z-index:20;padding:13px 14px 7px}
  #dock>.pane{grid-template-columns:repeat(2,minmax(0,1fr))}
  .zb{right:14px;bottom:14px}
}
@media(min-width:1280px){
  #dock{flex-basis:420px;width:420px}
  #dock>.pane{grid-template-columns:repeat(3,minmax(0,1fr))}
  #dock>.pane .wide{grid-column:1/-1}
}
@media(max-width:899px){
  #dock{max-height:56vh!important;overflow-y:auto}
  #dock::before{position:sticky;top:0;background:var(--dock-bg);z-index:20}
  #dock>.pane{grid-template-columns:repeat(2,minmax(0,1fr))}
  #dock>.pane::before{position:sticky;top:34px;background:var(--soft);z-index:5}
}
@media(max-width:430px){
  #dock{max-height:59vh!important}
  #dock>.pane{margin-left:7px;margin-right:7px;padding:9px;gap:6px}
  .pane button,.pane label.b,.pane select{min-height:44px;font-size:13px}
  #dock::before{padding-left:11px}
}

/* ===== UI V12: mobile-first polish ===== */
:root{--accent:#2f7f6f;--dock-bg:color-mix(in srgb,var(--card) 96%,transparent);--soft:color-mix(in srgb,var(--bg) 82%,var(--card));}
body{font-size:14px}
#vp{background-color:var(--bg);background-image:radial-gradient(var(--bd) .8px,transparent .8px);background-size:22px 22px}
#hint{left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);max-width:calc(100% - 150px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);border-radius:999px;padding:6px 11px;box-shadow:0 4px 14px #0002;z-index:8}
#hint.t{top:calc(env(safe-area-inset-top,0px) + 10px);max-width:calc(100% - 28px)}
#dock{position:relative;z-index:20;flex:none;max-height:min(48vh,520px);overflow:hidden;background:var(--dock-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid color-mix(in srgb,var(--bd) 80%,transparent);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0002;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs{display:flex;gap:4px;padding:6px 8px 5px;border-bottom:1px solid var(--bd);background:color-mix(in srgb,var(--card) 94%,transparent);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:4}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:1 0 68px;min-width:62px;min-height:50px;border:0;border-radius:13px;background:transparent;color:var(--fg);opacity:.58;font:600 11px/1.1 inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.16s ease;touch-action:manipulation}
#tabs button:first-letter{font-size:17px}
#tabs button span{font-size:11px}
#tabs button.on{opacity:1;background:var(--soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 20%,transparent)}
#tabs button:active{transform:scale(.96)}
.pane{padding:10px 10px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;overflow:auto;overscroll-behavior:contain;max-height:calc(min(48vh,520px) - 64px);scrollbar-width:thin}
.pane button,.pane label.b,.pane select{min-height:46px;border-radius:13px;border:1px solid color-mix(in srgb,var(--bd) 92%,transparent);background:var(--soft);box-shadow:0 1px 2px #0001;font-weight:600;transition:transform .12s ease,background .12s ease,border-color .12s ease}
.pane button:hover,.pane label.b:hover,.pane select:hover{border-color:color-mix(in srgb,var(--accent) 35%,var(--bd))}
.pane button:active,.pane label.b:active{transform:scale(.975)}
#txt{min-height:52px!important;border-radius:14px!important;background:var(--card)!important;border:2px solid color-mix(in srgb,var(--accent) 28%,var(--bd))!important;box-shadow:0 2px 10px #0001!important;font-weight:500!important}
#sws{gap:8px;padding:2px 1px}
.pane .sw{width:38px;height:38px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd),0 2px 6px #0002}
#pa .mic{background:color-mix(in srgb,var(--accent) 10%,var(--soft));border-color:color-mix(in srgb,var(--accent) 24%,var(--bd))}
#pa #addc{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 10px color-mix(in srgb,var(--accent) 25%,transparent)}
#pa #del{background:color-mix(in srgb,#d1495b 8%,var(--soft));}
#sq{min-height:48px!important;border-radius:14px!important;background:var(--card)!important}
